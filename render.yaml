# Render Blueprint — deploys the TeyaCollections API as a public Web Service.
#
# Usage: Render Dashboard → New + → Blueprint → pick this repo.
# Render reads this file and creates the service below. Secrets marked
# `sync: false` are prompted for in the dashboard (they are never stored here).
services:
  - type: web
    name: teyacollections-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # CORS allowlist — frontend origin(s), comma-separated.
      - key: CLIENT_URL
        value: https://teyacollections.com,https://www.teyacollections.com
      # ---- Secrets: set these in the Render dashboard ----
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
